dataset:
  type: pascal_semi
  train:
    data_root: ./data/VOC2012
    data_list: ./data/splitsall/pascal_u2pl/662/labeled.txt
    batch_size: 2
    flip: true
    rand_resize:
    - 0.5
    - 2.0
    resize_base_size: 500
    crop:
      type: rand
      size:
      - 513
      - 513
    strong_aug:
      num_augs: 3
      flag_use_random_num_sampling: true
  val:
    data_root: ./data/VOC2012
    data_list: ./data/splitsall/pascal_u2pl/val.txt
    batch_size: 1
  n_sup: 662
  workers: 4
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  ignore_label: 255
trainer:
  epochs: 80
  sup_only_epoch: 0
  evaluate_student: true
  optimizer:
    type: SGD
    kwargs:
      lr: 0.000125
      momentum: 0.9
      weight_decay: 0.0001
  lr_scheduler:
    mode: poly
    kwargs:
      power: 0.9
  unsupervised:
    flag_extra_weak: false
    threshold: 0.95
    loss_weight: 1.0
    use_cutmix: true
    use_cutmix_adaptive: true
    use_cutmix_trigger_prob: 1.0
saver:
  auto_resume: true
  snapshot_dir: ../../../../exp_boundary_mix_v1/a1_neutral_control
  pretrain: ''
  use_tb: false
criterion:
  type: CELoss
  kwargs:
    use_weight: false
net:
  num_classes: 21
  sync_bn: true
  ema_decay: 0.999
  encoder:
    type: augseg.models.resnet.resnet101
    pretrain: ./pretrained/resnet101.pth
    kwargs:
      zero_init_residual: true
      multi_grid: true
      replace_stride_with_dilation:
      - false
      - false
      - true
  decoder:
    type: augseg.models.decoder.dec_deeplabv3_plus
    kwargs:
      inner_planes: 256
      low_conv_planes: 48
      dilations:
      - 6
      - 12
      - 18
wandb:
  enable: true
  project: AugsegResearch
  entity: tanprodium-uit
  name: boundary_mix_v1_a1_neutral_control
  log_every: 50
run:
  name: boundary_mix_v1_a1_neutral_control
  log_every: 50
checkpoint:
  auto_resume: true
  save_latest: true
  save_best: true
hf:
  enabled: true
  repo_id: tanprodium/augseg-checkpoints
  repo_type: model
  auto_download: true
  auto_upload: true
  upload_every_epoch: true
  keep_only_latest: true
  bundle_name: latest.tar.gz
  path_in_repo: boundary_mix_v1/voc_semi662/a1_neutral_control/latest.tar.gz
  squash_after_upload: false
boundary_mix:
  enabled: true
  mode: fixed
  kernel_size: 5
  gamma_in: 1.0
  gamma_out: 1.0
  use_confidence: false
  normalize_weight: true
  debug: false
  vis_debug: false
